# =============================================================================
# Backend - 3 instancje z load balancingiem
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: translator
  labels:
    app: backend
spec:
  replicas: 3 # ⭐ 3 instancje backendu!
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: translator-backend:latest
          imagePullPolicy: Never
          command: ["node"]
          args: ["--import", "tsx", "src/index.ts"]
          ports:
            - containerPort: 4000
          env:
            # Z ConfigMap (nie-wrażliwe)
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: translator-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: translator-config
                  key: PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: translator-config
                  key: CORS_ORIGIN
            # Z Secrets (wrażliwe)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: translator-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: translator-secrets
                  key: REDIS_URL
          # Health checks
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      # Poczekaj aż baza i redis będą gotowe
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done",
            ]
        - name: wait-for-redis
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z redis 6379; do echo waiting for redis; sleep 2; done",
            ]

---
# Service - load balancer dla backendu
# K8s automatycznie rozdziela ruch między 3 pody!
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: translator
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
  type: LoadBalancer # Dostępne z zewnątrz (localhost:4000)
